  <path class="edge" d="M566,1007 H648" marker-end="url(#ah)"/>
  <text class="elbl" x="609.0" y="999" text-anchor="middle">48× each</text>
  <rect class="group" x="24" y="1213" width="948" height="126" rx="12"/>
  <text class="glbl" x="40" y="1233">CC3200 PINS — MUXED IN STEP 2 (pin_mux_config.c)</text>
  <rect class="b-planned" x="40" y="1247" width="252" height="76" rx="10"/>
  <text class="lbl" x="166.0" y="1271.0" text-anchor="middle">I2C0 · PIN_01 / PIN_02</text>
  <text class="note" x="166.0" y="1290.0" text-anchor="middle">muxed + clocked, i2c_if.c compiled,</text>
  <text class="note" x="166.0" y="1309.0" text-anchor="middle">never called · BMA222 unread (docs)</text>
  <rect class="b-orange" x="324" y="1247" width="262" height="76" rx="10"/>
  <text class="lbl" x="455.0" y="1271.0" text-anchor="middle">PIN_50 CS · PIN_06 MISO</text>
  <text class="note" x="455.0" y="1290.0" text-anchor="middle">CS pulsed active-high on every byte;</text>
  <text class="note" x="455.0" y="1309.0" text-anchor="middle">RX byte read + dropped · n.c. (docs)</text>
  <rect class="b-orange" x="610" y="1247" width="170" height="76" rx="10"/>
  <text class="lbl" x="695.0" y="1271.0" text-anchor="middle">GSPI · 100 kHz</text>
  <text class="note" x="695.0" y="1290.0" text-anchor="middle">CLK PIN_05</text>
  <text class="note" x="695.0" y="1309.0" text-anchor="middle">MOSI PIN_07</text>
  <rect class="b-orange" x="796" y="1247" width="172" height="76" rx="10"/>
  <text class="lbl" x="882.0" y="1271.0" text-anchor="middle">GPIO outputs</text>
  <text class="note" x="882.0" y="1290.0" text-anchor="middle">CS PIN_18 · D/C PIN_45</text>
  <text class="note" x="882.0" y="1309.0" text-anchor="middle">RST PIN_08 (init only)</text>
  <path class="edge" d="M652,1127 H455.0 V1243" marker-end="url(#ah)"/>
  <text class="elbl" x="626" y="1099" text-anchor="end">SPICSEnable / Disable,</text>
  <text class="elbl" x="626" y="1113" text-anchor="end">blocking dummy SPIDataGet (SDK)</text>
  <path class="edge" d="M695,1145 V1243" marker-end="url(#ah)"/>
  <text class="elbl" x="687" y="1194" text-anchor="end">SPIDataPut</text>
  <path class="edge" d="M860,1145 V1243" marker-end="url(#ah)"/>
  <text class="elbl" x="868" y="1187">D/C + CS,</text>
  <text class="elbl" x="868" y="1201">every byte</text>
  <path class="edge" d="M908,587 H952 V1243" marker-end="url(#ah)"/>
  <rect class="b-gray" x="610" y="1389" width="358" height="76" rx="10"/>
  <text class="lbl" x="789.0" y="1413.0" text-anchor="middle">SSD1351 OLED panel · 128 × 128</text>
  <text class="note" x="789.0" y="1432.0" text-anchor="middle">GRAM holds RGB565 pixels, 2 bytes each;</text>
  <text class="note" x="789.0" y="1451.0" text-anchor="middle">keeps showing the frame after main returns (docs)</text>
