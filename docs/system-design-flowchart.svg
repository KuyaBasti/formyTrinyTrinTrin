  <text class="lbl" x="313.0" y="1413.0" text-anchor="middle">oled_test.c — Adafruit test-pattern suite</text>
  <text class="note" x="313.0" y="1432.0" text-anchor="middle">compiled, never called by main()</text>
  <text class="note" x="313.0" y="1451.0" text-anchor="middle">main.c includes oled_test.h only for BLACK / RED / WHITE</text>
