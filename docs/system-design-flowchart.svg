  <rect class="bg" width="1000" height="1492" rx="12"/>
  <text class="title" x="32" y="48">Valentine's OLED Heart — end-to-end flowchart</text>
  <text class="sub" x="32" y="74">main() runs once: boot, pin mux, UART banner, 100 kHz SPI, then one frame through GFX and the driver.</text>
  <rect class="group" x="24" y="92" width="284" height="1055" rx="12"/>
  <text class="glbl" x="40" y="112">main() — main.c</text>
  <text class="glbl" x="40" y="128">RUNS ONCE, TOP TO BOTTOM</text>
  <rect class="b-blue" x="40" y="144" width="252" height="76" rx="10"/>
  <circle class="b-gray" cx="62" cy="182.0" r="11"/>
  <text class="lbl" x="62" y="187.0" text-anchor="middle">1</text>
  <text class="lbl" x="82" y="168.0">BoardInit()</text>
  <text class="note" x="82" y="187.0">vector table, interrupts on,</text>
  <text class="note" x="82" y="206.0">PRCMCC3200MCUInit()</text>
  <rect class="b-blue" x="40" y="244" width="252" height="76" rx="10"/>
  <circle class="b-gray" cx="62" cy="282.0" r="11"/>
  <text class="lbl" x="62" y="287.0" text-anchor="middle">2</text>
  <text class="lbl" x="82" y="268.0">PinMuxConfig()</text>
  <text class="note" x="82" y="287.0">SPI, UART0, I2C + 3 GPIO pins,</text>
  <text class="note" x="82" y="306.0">enables 5 peripheral clocks</text>
  <rect class="b-blue" x="40" y="374" width="252" height="76" rx="10"/>
  <circle class="b-gray" cx="62" cy="412.0" r="11"/>
  <text class="lbl" x="62" y="417.0" text-anchor="middle">3</text>
  <text class="lbl" x="82" y="398.0">UART banner</text>
  <text class="note" x="82" y="417.0">InitTerm, ClearTerm, 5 × Message</text>
  <text class="note" x="82" y="436.0">sent before GSPI reset + config</text>
  <rect class="b-blue" x="40" y="474" width="252" height="76" rx="10"/>
  <circle class="b-gray" cx="62" cy="512.0" r="11"/>
  <text class="lbl" x="62" y="517.0" text-anchor="middle">4</text>
  <text class="lbl" x="82" y="498.0">GSPI setup</text>
  <text class="note" x="82" y="517.0">reset, 100 kHz master, mode 0,</text>
  <text class="note" x="82" y="536.0">8-bit, SW CS active-high, enable</text>
  <rect class="b-blue" x="40" y="572" width="252" height="62" rx="10"/>
  <circle class="b-gray" cx="62" cy="603.0" r="11"/>
  <text class="lbl" x="62" y="608.0" text-anchor="middle">5</text>
  <text class="lbl" x="82" y="598.5">Adafruit_Init()</text>
  <text class="note" x="82" y="617.5">reset and configure the panel</text>
  <rect class="b-blue" x="40" y="672" width="252" height="62" rx="10"/>
  <circle class="b-gray" cx="62" cy="703.0" r="11"/>
  <text class="lbl" x="62" y="708.0" text-anchor="middle">6</text>
  <text class="lbl" x="82" y="698.5">fillScreen(BLACK)</text>
  <text class="note" x="82" y="717.5">clear all 128 × 128 pixels</text>
  <rect class="b-blue" x="40" y="831" width="252" height="76" rx="10"/>
  <circle class="b-gray" cx="62" cy="869.0" r="11"/>
  <text class="lbl" x="62" y="874.0" text-anchor="middle">7</text>
  <text class="lbl" x="82" y="855.0">drawHeart(RED)</text>
  <text class="note" x="82" y="874.0">center x = 64, y = 40, r = 12:</text>
  <text class="note" x="82" y="893.0">2 lobes + 1 triangle point</text>
  <rect class="b-blue" x="40" y="969" width="252" height="76" rx="10"/>
  <circle class="b-gray" cx="62" cy="1007.0" r="11"/>
  <text class="lbl" x="62" y="1012.0" text-anchor="middle">8</text>
  <text class="lbl" x="82" y="993.0">testWillYouBeMyValentine</text>
  <text class="note" x="82" y="1012.0">(WHITE): 'Will you be my', y 90</text>
  <text class="note" x="82" y="1031.0">'Valentine?', y 98 · centered</text>
  <rect class="b-blue" x="40" y="1069" width="252" height="62" rx="10"/>
  <circle class="b-gray" cx="62" cy="1100.0" r="11"/>
  <text class="lbl" x="62" y="1105.0" text-anchor="middle">9</text>
  <text class="lbl" x="82" y="1095.5">main returns</text>
  <text class="note" x="82" y="1114.5">no loop after the text is drawn</text>
  <path class="edge" d="M166.0,220 V240" marker-end="url(#ah)"/>
  <path class="edge" d="M166.0,320 V370" marker-end="url(#ah)"/>
  <path class="edge" d="M166.0,450 V470" marker-end="url(#ah)"/>
  <path class="edge" d="M166.0,550 V568" marker-end="url(#ah)"/>
