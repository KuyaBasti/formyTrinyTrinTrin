  <text class="glbl" x="356" y="132">LEGEND</text>
  <rect class="b-blue" x="356" y="150" width="26" height="14" rx="4"/>
  <text class="note" x="394" y="161">main.c, numbered in call order</text>
  <rect class="b-green" x="356" y="176" width="26" height="14" rx="4"/>
  <text class="note" x="394" y="187">GFX core — Adafruit_GFX.c</text>
  <rect class="b-purple" x="356" y="202" width="26" height="14" rx="4"/>
  <text class="note" x="394" y="213">SSD1351 driver — Adafruit_OLED.c</text>
  <rect class="b-orange" x="356" y="228" width="26" height="14" rx="4"/>
  <text class="note" x="394" y="239">CC3200 pins (pin_mux_config.c)</text>
  <rect class="b-red" x="666" y="150" width="26" height="14" rx="4"/>
  <text class="note" x="704" y="161">debug console — TI's uart_if.c</text>
  <rect class="b-gray" x="666" y="176" width="26" height="14" rx="4"/>
  <text class="note" x="704" y="187">hardware outside the CC3200</text>
  <rect class="b-planned" x="666" y="202" width="26" height="14" rx="4"/>
  <text class="note" x="704" y="213">compiled, never called</text>
  <path class="edge" d="M666,235 H692" marker-end="url(#ah)"/>
  <text class="note" x="704" y="239">call or byte flow</text>
  <circle class="dot" cx="369" cy="261" r="3.2"/>
  <text class="note" x="394" y="265">dot: call paths merge or split</text>
  <text class="note" x="356" y="294">(docs): from the repo's README or wiring diagram, not provable from code.</text>
  <text class="note" x="356" y="312">(SDK): set by the TI CC3200 SDK (not in this repo), as stated in the docs.</text>
  <rect class="group" x="340" y="340" width="632" height="126" rx="12"/>
  <text class="glbl" x="356" y="360">DEBUG CONSOLE — uart_if.c → UART0 → PC</text>
  <rect class="b-red" x="356" y="374" width="210" height="76" rx="10"/>
  <text class="lbl" x="461.0" y="398.0" text-anchor="middle">TI uart_if.c</text>
  <text class="note" x="461.0" y="417.0" text-anchor="middle">InitTerm · ClearTerm · Message</text>
  <text class="note" x="461.0" y="436.0" text-anchor="middle">8N1; Report, GetCmd unused</text>
  <rect class="b-gray" x="652" y="374" width="256" height="76" rx="10"/>
  <text class="lbl" x="780.0" y="398.0" text-anchor="middle">PC serial terminal</text>
  <text class="note" x="780.0" y="417.0" text-anchor="middle">'To my triny trin trin' banner</text>
  <text class="note" x="780.0" y="436.0" text-anchor="middle">115200 baud (SDK uart_if.h)</text>
  <path class="edge" d="M292,412.0 H352" marker-end="url(#ah)"/>
  <path class="edge" d="M566,412 H648" marker-end="url(#ah)"/>
  <text class="elbl" x="609.0" y="404" text-anchor="middle">UART0 TX</text>
  <text class="elbl" x="609.0" y="428" text-anchor="middle">PIN_55</text>
  <rect class="group" x="636" y="533" width="336" height="628" rx="12"/>
  <text class="glbl" x="652" y="553">SSD1351 DRIVER — Adafruit_OLED.c</text>
  <rect class="b-purple" x="652" y="565" width="256" height="76" rx="10"/>
  <text class="lbl" x="780.0" y="589.0" text-anchor="middle">Adafruit_Init</text>
  <text class="note" x="780.0" y="608.0" text-anchor="middle">RESET + CS pulsed via GPIO, then</text>
  <text class="note" x="780.0" y="627.0" text-anchor="middle">20 opcodes ending in DISPLAYON</text>
  <rect class="b-purple" x="652" y="665" width="256" height="76" rx="10"/>
  <text class="lbl" x="780.0" y="689.0" text-anchor="middle">fillScreen → fillRect</text>
  <text class="note" x="780.0" y="708.0" text-anchor="middle">one 128 × 128 window + WRITERAM,</text>
  <text class="note" x="780.0" y="727.0" text-anchor="middle">32,768 data bytes (2 per pixel)</text>
  <rect class="b-purple" x="652" y="785" width="256" height="76" rx="10"/>
  <text class="lbl" x="780.0" y="809.0" text-anchor="middle">drawFastVLine</text>
  <text class="note" x="780.0" y="828.0" text-anchor="middle">1-px-wide column window,</text>
  <text class="note" x="780.0" y="847.0" text-anchor="middle">WRITERAM, 2 bytes per pixel</text>
  <rect class="b-purple" x="652" y="877" width="256" height="76" rx="10"/>
  <text class="lbl" x="780.0" y="901.0" text-anchor="middle">drawFastHLine</text>
  <text class="note" x="780.0" y="920.0" text-anchor="middle">1-px-high row window,</text>
  <text class="note" x="780.0" y="939.0" text-anchor="middle">WRITERAM, 2 bytes per pixel</text>
  <rect class="b-purple" x="652" y="969" width="256" height="76" rx="10"/>
  <text class="lbl" x="780.0" y="993.0" text-anchor="middle">drawPixel → goTo(x, y)</text>
  <text class="note" x="780.0" y="1012.0" text-anchor="middle">window (x, y) to (127, 127),</text>
  <text class="note" x="780.0" y="1031.0" text-anchor="middle">then only one pixel's 2 bytes</text>
  <rect class="b-purple" x="652" y="1069" width="256" height="76" rx="10"/>
  <text class="lbl" x="780.0" y="1093.0" text-anchor="middle">writeCommand / writeData</text>
  <text class="note" x="780.0" y="1112.0" text-anchor="middle">per byte: D/C, CS low, SPICSEnable,</text>
  <text class="note" x="780.0" y="1131.0" text-anchor="middle">Put, dummy Get, SPICSDisable, CS high</text>
