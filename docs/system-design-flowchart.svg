  <rect class="group" x="340" y="735" width="242" height="326" rx="12"/>
  <text class="glbl" x="356" y="755">GFX CORE — Adafruit_GFX.c</text>
  <text class="glbl" x="356" y="771">PORTED FROM ARDUINO C++</text>
  <rect class="b-green" x="356" y="785" width="210" height="76" rx="10"/>
  <text class="lbl" x="461.0" y="809.0" text-anchor="middle">fillCircle × 2</text>
  <text class="note" x="461.0" y="828.0" text-anchor="middle">midpoint algorithm, r = 12,</text>
  <text class="note" x="461.0" y="847.0" text-anchor="middle">lobes at (52, 40), (76, 40)</text>
  <rect class="b-green" x="356" y="877" width="210" height="76" rx="10"/>
  <text class="lbl" x="461.0" y="901.0" text-anchor="middle">fillTriangle</text>
  <text class="note" x="461.0" y="920.0" text-anchor="middle">sort by y, then scanlines:</text>
  <text class="note" x="461.0" y="939.0" text-anchor="middle">(40,40) (88,40) (64,64)</text>
  <rect class="b-green" x="356" y="969" width="210" height="76" rx="10"/>
  <text class="lbl" x="461.0" y="993.0" text-anchor="middle">drawChar × 24</text>
  <text class="note" x="461.0" y="1012.0" text-anchor="middle">5×7 glcdfont.h glyph, 6 × 8 cell;</text>
  <text class="note" x="461.0" y="1031.0" text-anchor="middle">unlit dots drawn in bg too</text>
  <path class="edge" d="M292,869.0 H322"/>
