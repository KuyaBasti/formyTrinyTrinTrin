<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1048" width="1000" height="1048" role="img" aria-label="Valentine&#x27;s OLED Heart, one byte on the wire: a timing diagram of one writeData(c) or writeCommand(c) call in Adafruit_OLED.c. Step 1 drives D/C on PIN_45 (1 for data, 0 for command) and it is left at that level afterwards; step 2 pulls the GPIO chip select on PIN_18 low; step 3 SPICSEnable forces the active-high hardware chip select on PIN_50, which is not connected, high; step 4 SPIDataPut starts the GSPI shift: 8 clocks on PIN_05 in mode 0 and the 8 bits of c on MOSI PIN_07, 80 microseconds at 100 kHz, while 8 bits are clocked in on the unconnected MISO PIN_06; step 5 SPIDataGet spins until the received byte is in, reads it into ulDummy and drops it; step 6 SPICSDisable releases PIN_50; step 7 raises CS on PIN_18.">
  <style>
    .bg{fill:#ffffff}
    .title{fill:#1f2328;font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .sub{fill:#59636e;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .lbl{fill:#1f2328;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .note{fill:#59636e;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .glbl{fill:#59636e;font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.06em}
    .elbl{fill:#59636e;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .edge{stroke:#818b98;stroke-width:1.6;fill:none}
    .edge-dash{stroke:#818b98;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .arrow{fill:#818b98}
    .group{fill:none;stroke:#d1d9e0;stroke-width:1.2;stroke-dasharray:4 4}
    .b-blue{fill:#ddf4ff;stroke:#54aeff;stroke-width:1.5}
    .b-green{fill:#dafbe1;stroke:#4ac26b;stroke-width:1.5}
    .b-purple{fill:#fbefff;stroke:#c297ff;stroke-width:1.5}
    .b-orange{fill:#fff1e5;stroke:#fb8f44;stroke-width:1.5}
    .b-gray{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1.5}
    .b-red{fill:#ffebe9;stroke:#ff8182;stroke-width:1.5}
    .b-planned{fill:none;stroke:#818b98;stroke-width:1.4;stroke-dasharray:5 4}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .wire{stroke:#59636e;stroke-width:1.4;fill:none}
    .dot{fill:#59636e}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .title,.lbl{fill:#e6edf3}
      .sub,.note,.glbl,.elbl{fill:#9198a1}
      .edge,.edge-dash{stroke:#9198a1}
      .arrow{fill:#9198a1}
      .group{stroke:#3d444d}
      .b-blue{fill:#0c2d6b;stroke:#4493f8}
      .b-green{fill:#0f3b1e;stroke:#3fb950}
      .b-purple{fill:#2e1a4f;stroke:#ab7df8}
      .b-orange{fill:#3d1f0a;stroke:#f0883e}
      .b-gray{fill:#151b23;stroke:#3d444d}
      .b-red{fill:#3c1618;stroke:#f85149}
      .b-planned{stroke:#9198a1}
      .wire{stroke:#9198a1}
      .dot{fill:#9198a1}
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="1048" rx="12"/>
  <text class="title" x="32" y="48">Valentine’s OLED Heart — one byte on the wire</text>
  <text class="sub" x="32" y="74">Every command or data byte is one call: D/C and CS GPIOs around a blocking 8-bit GSPI transfer at 100 kHz.</text>
  <rect class="b-orange" x="32" y="89" width="14" height="14" rx="3"/>
  <text class="note" x="54" y="100">GPIO pin, set by GPIOPinWrite</text>
  <rect class="b-blue" x="253" y="89" width="14" height="14" rx="3"/>
  <text class="note" x="275" y="100">GSPI pin, moved by the SPI module</text>
  <rect class="b-planned" x="501" y="89" width="14" height="14" rx="3"/>
  <text class="note" x="523" y="100">muxed, n.c. in docs/wiring-diagram.svg</text>
  <line class="wire" x1="773" y1="96" x2="795" y2="96"/>
  <text class="note" x="803" y="100">mid line: no byte shifted</text>

  <!-- ============ TIMING ============ -->
  <rect class="group" x="24" y="118" width="952" height="528" rx="12"/>
  <text class="glbl" x="40" y="142">ONE CALL, TIME LEFT TO RIGHT (NOT TO SCALE)</text>
  <text class="elbl mono" x="960" y="142" text-anchor="end">Adafruit_OLED.c 27–58</text>
  <line class="group" x1="330" y1="199" x2="330" y2="586"/>
  <line class="group" x1="378" y1="199" x2="378" y2="586"/>
  <line class="group" x1="426" y1="199" x2="426" y2="586"/>
  <line class="group" x1="474" y1="199" x2="474" y2="586"/>
  <line class="group" x1="842" y1="199" x2="842" y2="586"/>
  <line class="group" x1="884" y1="199" x2="884" y2="586"/>
  <line class="group" x1="926" y1="199" x2="926" y2="586"/>
  <circle class="b-orange" cx="330" cy="186" r="11"/>
  <text class="lbl" x="330" y="191" text-anchor="middle">1</text>
  <circle class="b-orange" cx="378" cy="186" r="11"/>
  <text class="lbl" x="378" y="191" text-anchor="middle">2</text>
  <circle class="b-blue" cx="426" cy="186" r="11"/>
  <text class="lbl" x="426" y="191" text-anchor="middle">3</text>
  <circle class="b-blue" cx="474" cy="186" r="11"/>
  <text class="lbl" x="474" y="191" text-anchor="middle">4</text>
  <circle class="b-blue" cx="842" cy="186" r="11"/>
  <text class="lbl" x="842" y="191" text-anchor="middle">5</text>
  <circle class="b-blue" cx="884" cy="186" r="11"/>
  <text class="lbl" x="884" y="191" text-anchor="middle">6</text>
  <circle class="b-orange" cx="926" cy="186" r="11"/>
  <text class="lbl" x="926" y="191" text-anchor="middle">7</text>
  <text class="note" x="40" y="190">steps, in the table below</text>
  <line class="edge" x1="487" y1="186" x2="828" y2="186" marker-end="url(#ah)"/>
  <text class="elbl" x="658" y="177" text-anchor="middle">right after 4, SPIDataGet spins until the shift is done</text>
  <rect class="b-orange" x="36" y="212" width="190" height="52" rx="10"/>
  <text class="lbl" x="131" y="234" text-anchor="middle">D/C</text>
  <text class="note" x="131" y="252" text-anchor="middle">PIN_45 · GPIO31</text>
  <rect class="b-orange" x="36" y="276" width="190" height="52" rx="10"/>
  <text class="lbl" x="131" y="298" text-anchor="middle">CS</text>
  <text class="note" x="131" y="316" text-anchor="middle">PIN_18 · GPIO28, active low</text>
  <rect class="b-planned" x="36" y="340" width="190" height="52" rx="10"/>
  <text class="lbl" x="131" y="362" text-anchor="middle">GSPI_CS</text>
  <text class="note" x="131" y="380" text-anchor="middle">PIN_50 · hardware CS, n.c.</text>
  <rect class="b-blue" x="36" y="404" width="190" height="52" rx="10"/>
  <text class="lbl" x="131" y="426" text-anchor="middle">CLK</text>
  <text class="note" x="131" y="444" text-anchor="middle">PIN_05 · mode 0, idles low</text>
  <rect class="b-blue" x="36" y="468" width="190" height="52" rx="10"/>
  <text class="lbl" x="131" y="490" text-anchor="middle">MOSI</text>
  <text class="note" x="131" y="508" text-anchor="middle">PIN_07 → OLED DIN</text>
  <rect class="b-planned" x="36" y="532" width="190" height="52" rx="10"/>
  <text class="lbl" x="131" y="554" text-anchor="middle">MISO</text>
  <text class="note" x="131" y="572" text-anchor="middle">PIN_06 · n.c.</text>
  <path class="wire" d="M244,222 H324 L330,238 M244,254 H324 L330,238"/>
  <path class="b-orange" d="M330,238 L336,222 H966 V254 H336 Z"/>
  <text class="note" x="284" y="242" text-anchor="middle">previous</text>
  <text class="note" x="658" y="242" text-anchor="middle">1 = data (writeData)  ·  0 = command (writeCommand)</text>
  <text class="note" x="948" y="242" text-anchor="middle">held</text>
  <path class="wire" d="M244,286 H375 L381,318 H923 L929,286 H966"/>
  <text class="note" x="658" y="307" text-anchor="middle">low: OLED selected for the whole byte</text>
  <path class="edge-dash" d="M244,382 H423 L429,350 H881 L887,382 H966"/>
  <text class="note" x="658" y="368" text-anchor="middle">high while forced (SPI_CS_ACTIVEHIGH)</text>
  <path class="wire" d="M244,446 H518 V414 H538 V446 H558 V414 H578 V446 H598 V414 H618 V446 H638 V414 H658 V446 H678 V414 H698 V446 H718 V414 H738 V446 H758 V414 H778 V446 H798 V414 H818 V446 H966"/>
  <path class="wire" d="M244,494 H498 M818,494 H966"/>
  <path class="b-blue" d="M498,494 L504,478 H812 L818,494 L812,510 H504 Z"/>
  <text class="note mono" x="658" y="498" text-anchor="middle">byte c · 8 bits (SPI_WL_8)</text>
  <path class="edge-dash" d="M244,558 H498 M818,558 H966"/>
  <path class="b-planned" d="M498,558 L504,542 H812 L818,558 L812,574 H504 Z"/>
  <text class="note mono" x="658" y="562" text-anchor="middle">8 bits in → ulDummy, dropped</text>
  <line class="wire" x1="498" y1="592" x2="498" y2="612"/>
  <line class="wire" x1="818" y1="592" x2="818" y2="612"/>
  <line class="edge" x1="500" y1="606" x2="816" y2="606" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text class="note" x="658" y="628" text-anchor="middle">8 clocks × 10 µs = 80 µs at 100 kHz (SPI_IF_BIT_RATE, main.c:27)</text>

  <!-- ============ THE SEVEN STEPS ============ -->
  <rect class="group" x="24" y="666" width="952" height="362" rx="12"/>
  <text class="glbl" x="40" y="690">THE SEVEN STEPS, IN SOURCE ORDER</text>
  <text class="elbl mono" x="960" y="690" text-anchor="end">writeData 44–58 · writeCommand 27–41</text>
  <text class="elbl" x="56" y="720" text-anchor="middle">step</text>
  <text class="elbl" x="84" y="720">code in writeData(c)</text>
  <text class="elbl" x="432" y="720">what it does on the wire</text>
  <text class="elbl" x="956" y="720" text-anchor="end">line: writeData · writeCommand</text>
  <line class="group" x1="40" y1="730" x2="960" y2="730"/>
  <circle class="b-orange" cx="56" cy="745" r="11"/>
  <text class="lbl" x="56" y="750" text-anchor="middle">1</text>
  <text class="lbl mono" x="84" y="750">GPIOPinWrite(GPIOA3_BASE, 0x80, 0x80)</text>
  <text class="note" x="432" y="750">D/C ← 1: the byte is data. writeCommand writes 0 here: a command</text>
  <text class="note mono" x="956" y="750" text-anchor="end">:50 · :33</text>
  <circle class="b-orange" cx="56" cy="779" r="11"/>
  <text class="lbl" x="56" y="784" text-anchor="middle">2</text>
  <text class="lbl mono" x="84" y="784">GPIOPinWrite(GPIOA3_BASE, 0x10, 0)</text>
  <text class="note" x="432" y="784">CS ← 0: the OLED is selected, and stays so for the whole byte</text>
  <text class="note mono" x="956" y="784" text-anchor="end">:51 · :34</text>
  <circle class="b-blue" cx="56" cy="813" r="11"/>
  <text class="lbl" x="56" y="818" text-anchor="middle">3</text>
  <text class="lbl mono" x="84" y="818">MAP_SPICSEnable(GSPI_BASE)</text>
  <text class="note" x="432" y="818">forces the module’s own CS active: PIN_50 goes high</text>
  <text class="note mono" x="956" y="818" text-anchor="end">:52 · :35</text>
  <circle class="b-blue" cx="56" cy="847" r="11"/>
  <text class="lbl" x="56" y="852" text-anchor="middle">4</text>
  <text class="lbl mono" x="84" y="852">MAP_SPIDataPut(GSPI_BASE, c)</text>
  <text class="note" x="432" y="852">loads c into the TX register: the module clocks it out on MOSI</text>
  <text class="note mono" x="956" y="852" text-anchor="end">:53 · :36</text>
  <circle class="b-blue" cx="56" cy="881" r="11"/>
  <text class="lbl" x="56" y="886" text-anchor="middle">5</text>
  <text class="lbl mono" x="84" y="886">MAP_SPIDataGet(GSPI_BASE, &amp;ulDummy)</text>
  <text class="note" x="432" y="886">spins until the received byte is in: the de-facto “transfer done” wait</text>
  <text class="note mono" x="956" y="886" text-anchor="end">:55 · :38</text>
  <circle class="b-blue" cx="56" cy="915" r="11"/>
  <text class="lbl" x="56" y="920" text-anchor="middle">6</text>
  <text class="lbl mono" x="84" y="920">MAP_SPICSDisable(GSPI_BASE)</text>
  <text class="note" x="432" y="920">releases the module’s CS: PIN_50 back low</text>
  <text class="note mono" x="956" y="920" text-anchor="end">:56 · :39</text>
  <circle class="b-orange" cx="56" cy="949" r="11"/>
  <text class="lbl" x="56" y="954" text-anchor="middle">7</text>
  <text class="lbl mono" x="84" y="954">GPIOPinWrite(GPIOA3_BASE, 0x10, 0x10)</text>
  <text class="note" x="432" y="954">CS ← 1: byte framed. D/C is not touched, it keeps its level</text>
  <text class="note mono" x="956" y="954" text-anchor="end">:57 · :40</text>
  <text class="note" x="40" y="988">Steps 3–6 are TI driverlib SPI calls. In the linked image (Debug/spi_demo.out) SPIDataPut waits for TX empty before loading c,</text>
  <text class="note" x="40" y="1006">SPIDataGet loops until a received byte is ready and then reads it, and SPICSEnable / SPICSDisable set and clear one CS-force bit.</text>
</svg>
