<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="Valentine's OLED Heart wiring: CC3200 LaunchPad to an SSD1351 OLED and a USB debug bridge. 3V3 to OLED VCC, GND to OLED GND, GSPI_MOSI PIN_07 to DIN, GSPI_CLK PIN_05 to CLK (SPI 100 kHz mode 0), GPIO28 PIN_18 to CS, GPIO31 PIN_45 to D/C, GPIO17 PIN_08 to RST. GSPI_MISO PIN_06 and GSPI_CS PIN_50 are not connected. UART0_TX PIN_55 to the USB debug bridge RXD and UART0_RX PIN_57 from its TXD, UART0 115200 8N1. I2C_SCL PIN_01 and I2C_SDA PIN_02 are unused.">
  <style>
    .bg{fill:#ffffff}
    .title{fill:#1f2328;font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .sub{fill:#59636e;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .lbl{fill:#1f2328;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .note{fill:#59636e;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .glbl{fill:#59636e;font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.06em}
    .elbl{fill:#59636e;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .edge{stroke:#818b98;stroke-width:1.6;fill:none}
    .edge-dash{stroke:#818b98;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .arrow{fill:#818b98}
    .group{fill:none;stroke:#d1d9e0;stroke-width:1.2;stroke-dasharray:4 4}
    .b-blue{fill:#ddf4ff;stroke:#54aeff;stroke-width:1.5}
    .b-green{fill:#dafbe1;stroke:#4ac26b;stroke-width:1.5}
    .b-purple{fill:#fbefff;stroke:#c297ff;stroke-width:1.5}
    .b-orange{fill:#fff1e5;stroke:#fb8f44;stroke-width:1.5}
    .b-gray{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1.5}
    .b-red{fill:#ffebe9;stroke:#ff8182;stroke-width:1.5}
    .b-planned{fill:none;stroke:#818b98;stroke-width:1.4;stroke-dasharray:5 4}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .wire{stroke:#59636e;stroke-width:1.4;fill:none}
    .dot{fill:#59636e}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .title,.lbl{fill:#e6edf3}
      .sub,.note,.glbl,.elbl{fill:#9198a1}
      .edge,.edge-dash{stroke:#9198a1}
      .arrow{fill:#9198a1}
      .group{stroke:#3d444d}
      .b-blue{fill:#0c2d6b;stroke:#4493f8}
      .b-green{fill:#0f3b1e;stroke:#3fb950}
      .b-purple{fill:#2e1a4f;stroke:#ab7df8}
      .b-orange{fill:#3d1f0a;stroke:#f0883e}
      .b-gray{fill:#151b23;stroke:#3d444d}
      .b-red{fill:#3c1618;stroke:#f85149}
      .b-planned{stroke:#9198a1}
      .wire{stroke:#9198a1}
      .dot{fill:#9198a1}
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="620" rx="12"/>
  <text class="title" x="32" y="48">Valentine's OLED Heart — wiring</text>
  <text class="sub" x="32" y="74">Wiring as configured in pin_mux_config.c and driven by Adafruit_OLED.c / main.c</text>

  <!-- ===== USB debug bridge ===== -->
  <rect class="b-gray" x="32" y="104" width="200" height="118" rx="10"/>
  <text class="lbl" x="132" y="130" text-anchor="middle">USB debug (FTDI)</text>
  <text class="note" x="132" y="150" text-anchor="middle">the LaunchPad's USB bridge</text>
  <text class="note mono" x="220" y="180" text-anchor="end">RXD</text>
  <text class="note mono" x="220" y="206" text-anchor="end">TXD</text>

  <!-- ===== CC3200 LaunchPad ===== -->
  <rect class="b-blue" x="340" y="104" width="300" height="400" rx="10"/>
  <text class="lbl" x="490" y="130" text-anchor="middle">CC3200 LaunchPad</text>
  <!-- left column -->
  <text class="note mono" x="352" y="180">UART0_TX (PIN_55)</text>
  <text class="note mono" x="352" y="206">UART0_RX (PIN_57)</text>
  <text class="note" x="352" y="462"><tspan class="mono">I2C_SCL (PIN_01)</tspan> · unused</text>
  <text class="note" x="352" y="488"><tspan class="mono">I2C_SDA (PIN_02)</tspan> · unused</text>
  <!-- right column -->
  <text class="note mono" x="628" y="180" text-anchor="end">3V3</text>
  <text class="note mono" x="628" y="206" text-anchor="end">GND</text>
  <text class="note mono" x="628" y="244" text-anchor="end">GSPI_MOSI (PIN_07)</text>
  <text class="note mono" x="628" y="270" text-anchor="end">GSPI_CLK (PIN_05)</text>
  <text class="note mono" x="628" y="308" text-anchor="end">GPIO28 (PIN_18)</text>
  <text class="note mono" x="628" y="334" text-anchor="end">GPIO31 (PIN_45)</text>
  <text class="note mono" x="628" y="360" text-anchor="end">GPIO17 (PIN_08)</text>
  <text class="note mono" x="628" y="398" text-anchor="end">GSPI_MISO (PIN_06)</text>
  <text class="note mono" x="628" y="424" text-anchor="end">GSPI_CS (PIN_50)</text>

  <!-- ===== OLED (SSD1351) ===== -->
  <rect class="b-purple" x="800" y="104" width="160" height="272" rx="10"/>
  <text class="lbl" x="880" y="130" text-anchor="middle">OLED (SSD1351)</text>
  <text class="note" x="880" y="150" text-anchor="middle">128 × 128 RGB565</text>
  <text class="note mono" x="812" y="180">VCC</text>
  <text class="note mono" x="812" y="206">GND</text>
  <text class="note mono" x="812" y="244">DIN (MOSI)</text>
  <text class="note mono" x="812" y="270">CLK</text>
  <text class="note mono" x="812" y="308">CS</text>
  <text class="note mono" x="812" y="334">D/C</text>
  <text class="note mono" x="812" y="360">RST</text>

  <!-- ===== wires: CC3200 -> OLED ===== -->
  <path class="wire" d="M640,176 H800"/>
  <path class="wire" d="M640,202 H800"/>
  <path class="wire" d="M640,240 H800"/>
  <path class="wire" d="M640,266 H800"/>
  <path class="wire" d="M640,304 H800"/>
  <path class="wire" d="M640,330 H800"/>
  <path class="wire" d="M640,356 H800"/>
  <text class="elbl" x="720" y="225" text-anchor="middle">SPI · 100 kHz · mode 0</text>

  <!-- no-connect stubs: muxed but unwired -->
  <path class="wire" d="M640,394 H662"/>
  <text class="elbl" x="668" y="398">n.c.</text>
  <path class="wire" d="M640,420 H662"/>
  <text class="elbl" x="668" y="424">n.c.</text>

  <!-- ===== wires: CC3200 UART0 <-> USB debug ===== -->
  <!-- TX: PIN_55 -> RXD -->
  <path class="wire" d="M340,176 H232"/>
  <!-- RX: PIN_57 <- TXD -->
  <path class="wire" d="M340,202 H232"/>
  <text class="elbl" x="286" y="226" text-anchor="middle">UART0</text>
  <text class="elbl" x="286" y="241" text-anchor="middle">115200 8N1</text>

  <!-- ===== Legend ===== -->
  <text class="glbl" x="32" y="548">LEGEND</text>
  <rect class="b-blue" x="32" y="562" width="26" height="14" rx="4"/>
  <text class="note" x="70" y="573">CC3200 LaunchPad</text>
  <rect class="b-purple" x="272" y="562" width="26" height="14" rx="4"/>
  <text class="note" x="310" y="573">SSD1351 OLED display</text>
  <rect class="b-gray" x="512" y="562" width="26" height="14" rx="4"/>
  <text class="note" x="550" y="573">USB debug console</text>
  <path class="wire" d="M32,591 H58"/>
  <text class="note" x="70" y="595">wire</text>
  <path class="wire" d="M272,591 H294"/>
  <text class="note" x="310" y="595">n.c. = muxed, not wired</text>
</svg>
