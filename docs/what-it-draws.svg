  <text class="note mono" x="104" y="156">(0, 0)</text>
  <text class="note mono" x="616" y="156" text-anchor="end">(127, 0)</text>
  <text class="note mono" x="104" y="702">(0, 127)</text>
  <text class="note mono" x="616" y="702" text-anchor="end">(127, 127)</text>

